<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Диалоговые окна JavaScript</title>
    <script src="dialogs.js"></script>
</head>
<body>
    <!-- Сначала показываем только ссылку -->
    <div id="main" style="display: none;">
        <h2>Кнопки с вызовом функций:</h2>
        <button onclick="showAlert()">1. Alert (предупреждение)</button><br><br>
        <button onclick="showConfirm()">2. Confirm (подтверждение)</button><br><br>
        <button onclick="showPrompt()">3. Prompt (приглашение)</button><br><br>
        
        <h2>Форма с URL-схемой JavaScript:</h2>
        <form method="post" name="form" action="javascript:form.e.value='Нажали кнопку: Заполнить';void(0);">
            <input type="text" name="e" size="30" value=""><br>
            <input type="submit" value="Заполнить">
            <input type="reset" value="Очистить">
        </form>
        
        <p id="output"></p>
    </div>

    <!-- Ссылка для первого входа -->
    <div id="entry">
        <h2>URL-схема JavaScript:</h2>
        <a href="javascript:showMainPage();">Кликни здесь</a>
    </div>

    <script>
        function showMainPage() {
            alert('Внимание!!!');
            document.getElementById("entry").style.display = "none";
            document.getElementById("main").style.display = "block";
        }
    </script>
</body>
</html>
