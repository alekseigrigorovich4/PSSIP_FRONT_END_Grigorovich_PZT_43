<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Операторы JavaScript</title>
</head>
<body>
    <h1>Операторы JavaScript</h1>
    
    <script>
        // ========== 1. if ==========
        let age = 18;
        if (age >= 18) {
            document.write("<b>1. if:</b> Вы совершеннолетний<br>");
        }
        
        // ========== 2. if-else ==========
        let hour = 10;
        if (hour < 12) {
            document.write("<b>2. if-else:</b> Доброе утро<br>");
        } else {
            document.write("<b>2. if-else:</b> Добрый день<br>");
        }
        
        // ========== 3. if-else if-else ==========
        let score = 85;
        if (score >= 90) {
            document.write("<b>3. if-else if-else:</b> Отлично<br>");
        } else if (score >= 70) {
            document.write("<b>3. if-else if-else:</b> Хорошо<br>");
        } else if (score >= 50) {
            document.write("<b>3. if-else if-else:</b> Удовлетворительно<br>");
        } else {
            document.write("<b>3. if-else if-else:</b> Неудовлетворительно<br>");
        }
        
        // ========== 4. switch ==========
        let day = 3;
        let dayName;
        switch (day) {
            case 1: dayName = "Понедельник"; break;
            case 2: dayName = "Вторник"; break;
            case 3: dayName = "Среда"; break;
            case 4: dayName = "Четверг"; break;
            case 5: dayName = "Пятница"; break;
            case 6: dayName = "Суббота"; break;
            case 7: dayName = "Воскресенье"; break;
            default: dayName = "Неизвестный день";
        }
        document.write("<b>4. switch:</b> День недели: " + dayName + "<br>");
        
        // ========== 5. for ==========
        document.write("<b>5. for:</b> ");
        for (let i = 1; i <= 5; i++) {
            document.write(i + " ");
        }
        document.write("<br>");
        
        // ========== 6. while ==========
        document.write("<b>6. while:</b> ");
        let j = 1;
        while (j <= 5) {
            document.write(j + " ");
            j++;
        }
        document.write("<br>");
        
        // ========== 7. do..while ==========
        document.write("<b>7. do..while:</b> ");
        let k = 1;
        do {
            document.write(k + " ");
            k++;
        } while (k <= 5);
        document.write("<br>");
        
        // ========== 8. break ==========
        document.write("<b>8. break:</b> ");
        for (let i = 1; i <= 10; i++) {
            if (i == 6) break;
            document.write(i + " ");
        }
        document.write("(цикл прерван на 6)<br>");
        
        // ========== 9. continue ==========
        document.write("<b>9. continue:</b> ");
        for (let i = 1; i <= 8; i++) {
            if (i == 4 || i == 5) continue;
            document.write(i + " ");
        }
        document.write("(4 и 5 пропущены)<br>");
        
        // ========== 10. return (в функции) ==========
        function sum(a, b) {
            return a + b;
        }
        let result = sum(5, 7);
        document.write("<b>10. return:</b> Сумма 5 + 7 = " + result + "<br>");
    </script>
</body>
</html>
